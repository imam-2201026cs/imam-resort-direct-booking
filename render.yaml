# Render blueprint for the API. Secret values are set in the Render dashboard, never here.
services:
  - type: web
    name: resort-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: COOKIE_SAMESITE
        value: lax
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
